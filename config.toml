baseURL = "https://automaticdai.github.io/rts-blog/"
locale = "en-us"
defaultContentLanguage = "en"
hasCJKLanguage = false
title = "Real-Time Systems Blog"
theme = "hugo-theme-stack"

enableRobotsTXT = true

# NOTE: deliberately no [permalinks] block. Stack's demo config remaps
# post -> /p/:slug/, which would break every existing /post/<slug>/ URL.

[pagination]
  pagerSize = 20 # show all posts on one page

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  mainSections = ["post"]
  featuredImageField = "image"
  rssFullContent = true
  favicon = "/favicon.ico"

  [params.footer]
    since = 2015
    customText = ""

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02"

  [params.sidebar]
    subtitle = "Everything about Real-Time Systems. Written by Dr Steven Xiaotian Dai, Senior Lecturer in Real-Time Systems, University of York."
    avatar = "img/avatar.png"

  [params.article]
    math = false # enabled per-post via `math: true`
    toc = true
    readingTime = true
    [params.article.license]
      enabled = false

  [params.comments]
    enabled = false

  [[params.widgets.homepage]]
    type = "search"
  [[params.widgets.homepage]]
    type = "categories"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.homepage]]
    type = "tag-cloud"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.homepage]]
    type = "archives"
    [params.widgets.homepage.params]
      limit = 8

  [[params.widgets.page]]
    type = "toc"

  [params.opengraph.twitter]
    site = "StevenXDai"
    card = "summary_large_image"

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.imageProcessing.cover]
    enabled = true
  [params.imageProcessing.content]
    enabled = true

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = -100
  [menu.main.params]
    icon = "home"

[[menu.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/automaticdai"
  [menu.social.params]
    icon = "brand-github"

[[menu.social]]
  identifier = "linkedin"
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/xdai3"
  [menu.social.params]
    icon = "brand-linkedin"

[[menu.social]]
  identifier = "twitter"
  name = "Twitter"
  url = "https://twitter.com/StevenXDai"
  [menu.social.params]
    icon = "brand-twitter"

[[menu.social]]
  identifier = "email"
  name = "Email"
  url = "mailto:xiaotian.dai@york.ac.uk"
  [menu.social.params]
    icon = "mail"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
